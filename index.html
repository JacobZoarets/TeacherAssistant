<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>עוזר הוראה · לימוד לרישיון פנסיוני</title>
<meta name="theme-color" content="#F5FAFE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="עוזר הוראה">
<meta name="description" content="עוזר הוראה לרישיון סוכן ביטוח פנסיוני — סמני מה את יודעת ומה קשה, וקבלי שיעור מותאם.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%2316345C' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%237E2340'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@200;300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#16345C;
  --navy2:#24507F;
  --blue:#3E6FA8;
  --sky:#9CC3E8;
  --sky-l:#EAF3FB;
  --sky-xl:#F5FAFE;
  --burg:#7E2340;
  --burg-l:#A8566F;
  --burg-xl:#F9EEF2;
  --ink:#152A45;
  --txt:#3C5471;
  --mut:#7C93AC;
  --faint:#A9BDD2;
  --line:#DCE9F5;
  --ok:#2F7D6B;
  --sans:'Heebo','Assistant','Segoe UI',system-ui,Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;overflow:hidden;height:100vh;height:100dvh;
  font-family:var(--sans);font-weight:300;color:var(--txt);
  font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background:
    radial-gradient(70% 46% at 88% -8%, rgba(156,195,232,.42) 0%, rgba(156,195,232,0) 70%),
    radial-gradient(56% 40% at -6% 8%, rgba(168,86,111,.14) 0%, rgba(168,86,111,0) 70%),
    radial-gradient(80% 50% at 50% 112%, rgba(62,111,168,.16) 0%, rgba(62,111,168,0) 72%),
    linear-gradient(170deg,#FDFEFF 0%,var(--sky-l) 100%);
}
h1,h2,h3,h4{margin:0;font-weight:300;color:var(--ink);letter-spacing:-.02em}
p{margin:0}
button{font-family:inherit;font-size:inherit;border:0;background:none;color:inherit;cursor:pointer;padding:0;margin:0;-webkit-appearance:none;appearance:none}
a{color:var(--burg);text-decoration:none}
.hidden{display:none!important}
.eyebrow{font-size:10.5px;letter-spacing:.24em;font-weight:500;color:var(--burg-l)}
.muted{color:var(--mut)}
.tiny{font-size:12.5px;line-height:1.65}

/* ================= app frame ================= */
.app{height:100vh;height:100dvh;width:100%;min-width:0;display:flex;flex-direction:column;max-width:680px;margin:0 auto;
  padding:max(12px,env(safe-area-inset-top)) 14px max(10px,env(safe-area-inset-bottom));gap:9px}


/* ---------- header ---------- */
.hdbtns{position:absolute;top:2px;inset-inline-end:4px;display:flex;gap:6px;z-index:2}
.nameinput{-webkit-appearance:none;appearance:none;margin:0;width:100%;max-width:280px;border:1px solid var(--line);border-radius:14px;padding:11px 15px;
  font-family:inherit;font-weight:300;font-size:14.5px;color:var(--txt);background:rgba(255,255,255,.85)}
.nameinput:focus{outline:none;border-color:var(--sky);background:#fff}
.namewrap{position:relative;display:inline-block;width:100%;max-width:280px}
.namewrap .nameinput{width:100%;max-width:none;padding-inline-end:38px}
.nameclear{position:absolute;top:50%;transform:translateY(-50%);inset-inline-end:8px;
  width:24px;height:24px;border-radius:50%;background:var(--sky-l);color:var(--navy2);
  font-size:11px;display:grid;place-items:center;transition:.25s}
.nameclear:hover{background:var(--sky)}
.lv.gsel.on{color:#fff;border-color:transparent;background:var(--navy2)}
.cloudlink{position:static;font-size:11.5px;color:var(--mut);
  padding:6px 13px;border-radius:16px;border:1px solid var(--line);background:rgba(255,255,255,.6);
  transition:.25s;z-index:2}
.cloudlink:hover{color:var(--navy);border-color:var(--sky)}
.hd{position:relative;flex:0 0 auto;padding:2px 4px 0;animation:drop .7s cubic-bezier(.2,.8,.2,1) backwards}
.hd h1{font-size:16px;font-weight:500;color:var(--navy);letter-spacing:-.02em;line-height:30px;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default}


/* ---------- prompt card (main) ---------- */
.pcard{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:28px;
  box-shadow:0 24px 60px -30px rgba(22,52,92,.35), 0 2px 10px -4px rgba(22,52,92,.08);
  padding:20px 20px 16px;animation:drop .7s .12s cubic-bezier(.2,.8,.2,1) backwards}
.pcard .ph{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.pcard .ph h2{font-size:16.5px;font-weight:400}
.pstat{display:flex;gap:6px;flex-wrap:wrap;flex:0 0 auto;margin-bottom:12px}
.pstat span{font-size:11.5px;padding:4px 11px;border-radius:20px;background:var(--sky-l);
  color:var(--navy2);font-weight:400;transition:.3s}
.pstat span.warn{background:var(--burg-xl);color:var(--burg)}
.pbox{flex:1 1 auto;min-height:0;overflow:hidden;position:relative;
  font-size:13px;line-height:1.8;color:var(--txt);white-space:pre-wrap;
  border-radius:18px;background:var(--sky-xl);padding:14px 16px;transition:.3s}
.pbox:after{content:"";position:absolute;bottom:0;left:0;right:0;height:56px;
  background:linear-gradient(to top,var(--sky-xl),transparent);border-radius:0 0 18px 18px;pointer-events:none}
.pbox.full{overflow-y:auto;-webkit-overflow-scrolling:touch}
.pbox.full:after{display:none}
.pmore{flex:0 0 auto;align-self:center;margin-top:8px;font-size:12px;color:var(--blue);
  padding:4px 14px;border-radius:16px;transition:.25s}
.pmore:hover{color:var(--navy)}
.pfoot{flex:0 0 auto;display:flex;gap:10px;margin-top:12px}
.copybtn{flex:1;padding:14px 18px;border-radius:20px;font-size:15px;font-weight:500;color:#fff;
  background:linear-gradient(135deg,var(--burg) 0%,#9C3557 60%,var(--burg-l) 100%);
  box-shadow:0 14px 30px -14px rgba(126,35,64,.55);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.copybtn:hover{transform:translateY(-1px);box-shadow:0 18px 34px -14px rgba(126,35,64,.65)}
.copybtn:active{transform:scale(.98)}
.copybtn.ok{background:linear-gradient(135deg,var(--ok),#3E9682)}
.editbtn{flex:0 0 auto;padding:14px 16px;border-radius:20px;font-size:13.5px;color:var(--navy);
  background:rgba(255,255,255,.8);border:1px solid var(--line);transition:.25s}
.editbtn:hover{border-color:var(--sky)}

/* ---------- menu ---------- */
.menu{flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
  animation:drop .7s .18s cubic-bezier(.2,.8,.2,1) backwards}
.mbtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:11px 4px 10px;
  border-radius:20px;background:rgba(255,255,255,.62);border:1px solid var(--line);
  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .25s,border-color .25s}
.mbtn:hover{transform:translateY(-2px);border-color:var(--sky);background:rgba(255,255,255,.9)}
.mbtn:active{transform:scale(.96)}
.mbtn .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(135deg,var(--navy2),var(--blue));color:#fff;font-size:13px;font-weight:400}
.mbtn:nth-child(2) .ic{background:linear-gradient(135deg,var(--blue),var(--sky))}
.mbtn:nth-child(3) .ic{background:linear-gradient(135deg,var(--burg),var(--burg-l))}
.mbtn:nth-child(4) .ic{background:linear-gradient(135deg,var(--navy),var(--navy2))}
.mbtn .lb{font-size:11.5px;color:var(--txt);font-weight:400;white-space:nowrap}
.mbtn .bd{font-size:10px;color:var(--faint)}

/* ================= sheets ================= */
.scrim{position:fixed;inset:0;background:rgba(22,52,92,.32);backdrop-filter:blur(3px);
  opacity:0;pointer-events:none;transition:opacity .35s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;margin:0 auto;max-width:680px;
  max-height:88vh;max-height:88dvh;display:flex;flex-direction:column;
  background:linear-gradient(178deg,#FFFFFF 0%,var(--sky-xl) 100%);
  border-radius:30px 30px 0 0;box-shadow:0 -18px 60px -20px rgba(22,52,92,.45);
  transform:translateY(104%);transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.sheet.on{transform:translateY(0)}
.sh-grab{flex:0 0 auto;display:grid;place-items:center;padding:10px 0 2px}
.sh-grab i{width:40px;height:4px;border-radius:4px;background:var(--line)}
.sh-head{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 22px 12px}
.sh-head h3{flex:1;font-size:19px;font-weight:400}
.sh-head .x{width:32px;height:32px;border-radius:50%;background:var(--sky-l);color:var(--navy2);
  display:grid;place-items:center;font-size:15px;transition:.25s}
.sh-head .x:hover{background:var(--sky)}
.sh-sub{flex:0 0 auto;padding:0 22px 12px;font-size:13px;color:var(--mut);line-height:1.7}
.sh-body{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:4px 22px calc(24px + env(safe-area-inset-bottom))}
@keyframes drop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- read more ---------- */
.rm{position:relative;max-height:66px;overflow:hidden;transition:max-height .4s cubic-bezier(.2,.8,.2,1)}
.rm:after{content:"";position:absolute;bottom:0;left:0;right:0;height:34px;
  background:linear-gradient(to top,#fff,transparent);pointer-events:none;transition:opacity .3s}
.rm.open{max-height:900px}
.rm.open:after{opacity:0}
.rmbtn{font-size:12px;color:var(--blue);margin-top:5px;padding:2px 0;display:inline-block}

/* ---------- exams & topics ---------- */
.exrow{display:flex;flex-direction:column;gap:9px;margin-bottom:26px}
.ex{text-align:right;padding:14px 18px;border:1px solid var(--line);border-radius:20px;
  background:rgba(255,255,255,.8);transition:.3s cubic-bezier(.2,.8,.2,1)}
.ex:hover{border-color:var(--sky)}
.ex.on{border-color:var(--navy2);background:#fff;box-shadow:0 10px 26px -16px rgba(22,52,92,.35)}
.ex .exn{font-size:15px;color:var(--ink);font-weight:400}
.ex .exm{display:block;font-size:12px;color:var(--faint);margin-top:2px}
.ex.on .exm{color:var(--blue)}
.tgroup{margin-bottom:26px}
.tgh{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:0 4px 10px}
.tgh .gn{font-size:10.5px;letter-spacing:.2em;color:var(--burg-l);font-weight:500}
.tgh .gc{font-size:11.5px;color:var(--faint)}
.tp{padding:13px 16px;margin-bottom:8px;border-radius:18px;background:rgba(255,255,255,.75);
  border:1px solid var(--line);transition:.3s;animation:rise .4s cubic-bezier(.2,.8,.2,1) backwards}
.tp .nm{font-size:14px;color:var(--ink);line-height:1.5;margin-bottom:8px;font-weight:400}
.tp.q .nm{color:var(--mut);font-weight:300}
.lvrow{display:flex;gap:6px;flex-wrap:wrap}
.lv{padding:5px 12px;border-radius:16px;font-size:11.5px;color:var(--mut);
  border:1px solid var(--line);background:#fff;transition:.25s;white-space:nowrap}
.lv:hover{border-color:var(--sky)}
.lv.on{color:#fff;border-color:transparent;background:var(--navy2)}
.lv.on[data-v="learning"]{background:var(--blue)}
.lv.on[data-v="shaky"]{background:var(--burg)}
.lv.on[data-v="solid"]{background:var(--ok)}
.empty{font-size:13.5px;color:var(--faint);padding:20px 4px;line-height:1.8}

/* ---------- choices ---------- */
.choices{display:flex;flex-direction:column;gap:8px;margin-bottom:28px}
.choice{text-align:right;padding:13px 17px;border:1px solid var(--line);border-radius:18px;
  background:rgba(255,255,255,.75);transition:.3s cubic-bezier(.2,.8,.2,1)}
.choice:hover{border-color:var(--sky)}
.choice.on{border-color:var(--navy2);background:#fff;box-shadow:0 10px 24px -16px rgba(22,52,92,.3)}
.choice .cn{font-size:14px;color:var(--ink);font-weight:400}
.choice.on .cn:before{content:"✓ ";color:var(--burg);font-weight:500}
.choice .cd{display:block;font-size:12px;color:var(--faint);margin-top:2px;line-height:1.6}
textarea{width:100%;min-height:110px;border:1px solid var(--line);border-radius:18px;
  padding:15px 17px;font-family:inherit;font-weight:300;font-size:14px;line-height:1.8;
  color:var(--txt);background:rgba(255,255,255,.85);resize:vertical;transition:.3s}
textarea::placeholder{color:var(--faint)}
textarea:focus{outline:none;border-color:var(--sky);background:#fff}
.saved{font-size:12px;color:var(--ok);opacity:0;transition:.4s;margin-top:8px}
.saved.on{opacity:1}

/* ---------- history ---------- */
.hstat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:22px}
.hstat div{background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:18px;
  padding:12px 6px;text-align:center}
.hstat b{display:block;font-size:22px;font-weight:300;color:var(--navy);letter-spacing:-.02em}
.hstat span{font-size:10.5px;color:var(--faint);letter-spacing:.06em}
.stuck{font-size:13.5px;color:var(--txt);padding:11px 16px;margin-bottom:8px;
  border-radius:16px;background:var(--burg-xl);line-height:1.7}
.stuck b{color:var(--burg);font-weight:500}
.logline{display:flex;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);font-size:13px}
.logline:last-child{border-bottom:0}
.logline .ld{flex:0 0 64px;color:var(--faint);font-size:11.5px;white-space:nowrap;padding-top:2px}
.logline .lt{flex:1;color:var(--txt);line-height:1.6}
.logline .lv2{color:var(--faint);font-size:12px}

/* ---------- track & dates ---------- */
.stage{margin-bottom:9px;border-radius:20px;background:rgba(255,255,255,.78);
  border:1px solid var(--line);overflow:hidden;transition:.3s}
.stage-top{display:flex;gap:13px;align-items:center;padding:14px 17px;cursor:pointer}
.num{flex:0 0 30px;height:30px;border-radius:50%;display:grid;place-items:center;
  font-size:12px;font-weight:400;color:#fff;background:linear-gradient(135deg,var(--navy2),var(--blue))}
.stage-ttl{flex:1;min-width:0}
.stage-ttl h3{font-size:14.5px;font-weight:400}
.stage-ttl .meta{font-size:11.5px;color:var(--faint);margin-top:1px}
.chev{flex:0 0 auto;color:var(--faint);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.stage.open .chev{transform:rotate(180deg)}
.stage-body{display:none;padding:2px 18px 16px;font-size:13.5px}
.stage.open .stage-body{display:block;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.stage-body ul{margin:0 0 12px;padding:0;list-style:none}
.stage-body li{color:var(--txt);margin-bottom:7px;padding-inline-start:16px;position:relative;line-height:1.7}
.stage-body li:before{content:"";position:absolute;inset-inline-start:2px;top:10px;width:5px;height:5px;border-radius:50%;background:var(--sky)}
.stage-body b{font-weight:500;color:var(--ink)}
.linkrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.linkbtn{font-size:12px;color:var(--navy2);background:var(--sky-l);border-radius:14px;padding:6px 13px;transition:.25s}
.linkbtn:hover{background:var(--sky)}
.dgroup{font-size:10.5px;letter-spacing:.2em;color:var(--burg-l);font-weight:500;margin:26px 4px 10px}
.dtable{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:13px}
.dtable td{padding:11px 14px;background:rgba(255,255,255,.75);vertical-align:top;line-height:1.6}
.dtable td:first-child{border-radius:0 16px 16px 0;white-space:nowrap;color:var(--navy);
  font-size:12px;font-weight:500;width:78px}
.dtable td:last-child{border-radius:16px 0 0 16px;color:var(--txt)}
.dtable td .n{display:block;color:var(--faint);font-size:11.5px;margin-top:2px;line-height:1.6}
.dtable tr.past{opacity:.45}
.pill{font-size:10px;letter-spacing:.1em;font-weight:500;padding:2px 9px;border-radius:12px}
.pill.rose{background:var(--burg-xl);color:var(--burg)}

/* ---------- reference ---------- */
.ntable{width:100%;border-collapse:separate;border-spacing:0 7px;font-size:13px}
.ntable td{padding:11px 14px;background:rgba(255,255,255,.75);vertical-align:top;line-height:1.6}
.ntable td:first-child{border-radius:0 16px 16px 0;color:var(--txt)}
.ntable td:last-child{border-radius:16px 0 0 16px;text-align:left;white-space:nowrap;
  color:var(--navy);font-weight:500;font-size:13.5px;padding-inline-start:14px}
.ntable td .h{display:block;font-size:11.5px;color:var(--faint);margin-top:2px;line-height:1.6}
.frm{padding:15px 17px;margin-bottom:9px;border-radius:18px;background:rgba(255,255,255,.78);border:1px solid var(--line)}
.frm h4{font-size:14px;font-weight:400;color:var(--ink)}
.frm .eq{font-size:13.5px;color:var(--navy);background:var(--sky-l);border-radius:14px;padding:10px 14px;margin:9px 0;line-height:1.7}
.frm p{font-size:12.5px;color:var(--mut);line-height:1.75}
.filters{display:flex;flex-wrap:wrap;gap:7px;padding:4px 2px 12px;margin-bottom:0;flex:0 0 auto;width:100%;max-width:100%;min-width:0}
.filters::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:6px 14px;border-radius:16px;font-size:12px;color:var(--mut);
  border:1px solid var(--line);background:#fff;white-space:nowrap;transition:.25s}
.chip.on{background:var(--navy2);border-color:var(--navy2);color:#fff}
.fc{margin-bottom:8px;border-radius:18px;background:rgba(255,255,255,.75);border:1px solid var(--line);overflow:hidden}
.fc-q{display:flex;align-items:center;gap:11px;padding:13px 16px;cursor:pointer}
.fc-q .dot{width:6px;height:6px;border-radius:50%;background:var(--sky);flex:0 0 6px}
.fc-q .t{flex:1;font-size:14px;color:var(--ink);font-weight:400;line-height:1.5}
.fc-q .cat{display:block;font-size:10.5px;color:var(--faint);letter-spacing:.1em;margin-top:2px;font-weight:300}
.fc-a{display:none;padding:0 16px 14px;font-size:13px;color:var(--txt);line-height:1.8}
.fc.open .fc-a{display:block;animation:rise .35s cubic-bezier(.2,.8,.2,1)}
.fc-a .hi{color:var(--navy);font-weight:500}
.note{font-size:12px;line-height:1.75;color:var(--mut);background:rgba(255,255,255,.6);
  border-radius:16px;padding:13px 16px;margin-top:18px}
.note b{font-weight:500;color:var(--txt)}
.qbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.qbtn{padding:6px 13px;border-radius:16px;font-size:11.5px;color:var(--navy2);
  border:1px solid var(--line);background:#fff;transition:.25s;white-space:nowrap}
.qbtn:hover{border-color:var(--sky);background:var(--sky-l)}
.solbox{margin-top:14px;border-radius:18px;background:#fff;border:1px solid var(--line);
  overflow:hidden;font-size:13px;line-height:1.8;color:var(--txt);
  box-shadow:0 14px 34px -22px rgba(22,52,92,.35)}
.solhead{display:flex;align-items:center;gap:12px;padding:13px 16px}
.solbox.okk .solhead{background:linear-gradient(135deg,rgba(47,125,107,.10),rgba(47,125,107,.03))}
.solbox.nok .solhead{background:linear-gradient(135deg,rgba(126,35,64,.09),rgba(126,35,64,.02))}
.solmark{flex:0 0 30px;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;
  color:#fff;font-size:14px;font-weight:500}
.solbox.okk .solmark{background:linear-gradient(135deg,var(--ok),#3E9682)}
.solbox.nok .solmark{background:linear-gradient(135deg,var(--burg),var(--burg-l))}
.soltit{flex:1;min-width:0;line-height:1.45}
.soltit b{display:block;font-size:14px;font-weight:500;color:var(--ink)}
.soltit span{font-size:11.5px;color:var(--mut)}
.solchip{flex:0 0 auto;min-width:30px;height:30px;border-radius:10px;display:grid;place-items:center;
  padding:0 9px;font-size:14px;font-weight:500;color:var(--navy);background:var(--sky-l)}
.solsec{padding:12px 16px 2px}

.qbtn.ghost{color:var(--burg-l);border-color:rgba(126,35,64,.25)}

.deepen{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;
  padding:11px 14px;border-radius:14px;border:1px dashed var(--line);background:rgba(255,255,255,.5);
  animation:qin .5s .35s cubic-bezier(.2,.8,.2,1) backwards}
.deepen .sollbl{flex:1 1 100%;margin-bottom:2px}
.whyme{background:rgba(126,35,64,.04);border-radius:12px;margin:10px 12px 0;padding:11px 14px 3px}
.whyme .sollbl{color:var(--burg)}
.whyall-btn{font-size:12px;color:var(--blue);padding:2px 0;transition:.25s}
.whyall-btn:hover{color:var(--navy)}
.whyall{margin-top:8px;animation:rise .4s cubic-bezier(.2,.8,.2,1)}
.whyall p{margin:0 0 8px;font-size:13.5px;line-height:1.85;color:var(--txt)}
.whyall b{color:var(--navy2)}
.solfoot{display:flex;align-items:center;gap:12px;padding:10px 16px 13px;margin-top:6px;border-top:1px solid var(--line)}
.solnote{flex:1;font-size:10.5px;color:var(--faint);line-height:1.6}
.nextsol{flex:0 0 auto;font-size:12.5px;font-weight:500;color:#fff;padding:8px 16px;border-radius:14px;
  background:linear-gradient(135deg,var(--navy2),var(--blue));
  transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.nextsol:hover{transform:translateY(-1px);box-shadow:0 10px 20px -12px rgba(36,80,127,.6)}
.sol-btn{color:#fff!important;background:var(--ok)!important;border-color:var(--ok)!important}
.exampick{flex:0 0 auto;display:flex;gap:8px;animation:drop .7s .05s cubic-bezier(.2,.8,.2,1) backwards}
.expill{flex:1;padding:6px 10px;border-radius:16px;font-size:12px;color:var(--txt);
  background:rgba(255,255,255,.62);border:1px solid var(--line);transition:.25s}
.expill span{display:inline;font-size:10.5px;color:var(--faint);margin-inline-start:6px}
.expill.on{border-color:var(--navy2);background:#fff;color:var(--navy);box-shadow:0 10px 24px -16px rgba(22,52,92,.4)}
.expill.on span{color:var(--blue)}
.player{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;
  background:rgba(255,255,255,.78);backdrop-filter:blur(14px);
  border:1px solid rgba(255,255,255,.9);border-radius:26px;
  box-shadow:0 24px 60px -30px rgba(22,52,92,.35);
  padding:14px 16px 10px;animation:drop .7s .1s cubic-bezier(.2,.8,.2,1) backwards}
.pmeta{flex:0 0 auto;display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut);margin-bottom:8px}
.pmeta span:last-child{color:var(--ok);font-weight:500}
.pmeta span:last-child.fail{color:var(--burg)}
.restart{margin-inline-start:2px;font-size:14px;padding:7px 10px;color:var(--burg-l)}
.restart:hover{border-color:var(--burg-l)}
.qbar{flex:0 0 auto;height:3px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:12px}
.qbar i{display:block;height:100%;background:linear-gradient(to left,var(--burg),var(--sky));transition:width .4s;width:0}
.qscroll{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:2px}
.qtext{font-size:16px;line-height:1.85;color:var(--ink);margin-bottom:14px}
.optbtn{display:block;width:100%;text-align:right;padding:13px 16px;border-radius:14px;
  border:1px solid var(--line);background:rgba(255,255,255,.7);margin-bottom:9px;
  font-size:14.5px;line-height:1.75;color:var(--txt);transition:.25s}
.optbtn b{color:var(--navy2);margin-inline-end:4px}
.optbtn:not(.done):hover{border-color:var(--sky);background:#fff}
.optbtn.right{border-color:var(--ok);background:rgba(47,125,107,.07)}
.optbtn.right b{color:var(--ok)}
.optbtn.wrong{border-color:var(--burg-l);background:rgba(126,35,64,.05)}
.optbtn.wrong b{color:var(--burg)}
.optbtn.done{cursor:default}
.verdict{display:inline-block;margin-inline-start:10px;padding:2px 10px;border-radius:12px;
  font-size:11px;font-weight:500;vertical-align:1px;animation:pop .45s cubic-bezier(.2,.8,.2,1)}
.verdict.vg{background:rgba(47,125,107,.12);color:var(--ok)}
.verdict.vr{background:rgba(126,35,64,.10);color:var(--burg)}
.pnav{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding-top:10px}
.trust{flex:0 0 auto;text-align:center;font-size:10.5px;color:var(--faint);line-height:1.6;padding-top:7px}
.navb{flex:0 0 auto;font-size:12px;color:var(--navy2);padding:7px 12px;border-radius:14px;
  border:1px solid var(--line);background:#fff;transition:.25s}
.navb:disabled{opacity:.35}
.navb:not(:disabled):hover{border-color:var(--sky)}
.dots{flex:1;display:grid;grid-template-columns:repeat(20,1fr);gap:2px;align-content:center}
.dot2{height:9px;min-width:0;border-radius:3px;background:var(--line);transition:background .3s,box-shadow .2s;padding:0}
.dot2.g{background:var(--ok)}
.dot2.r{background:var(--burg)}
.dot2.cur{box-shadow:0 0 0 1.5px var(--navy2)}
.reset{font-size:11.5px;color:var(--faint);margin:18px auto 0;display:block;text-align:center}
.reset:hover{color:var(--mut)}

@media(min-width:640px){
  .menu{gap:10px}
  .mbtn .lb{font-size:12.5px}
  .pbox{font-size:13.5px}
}
@media(max-height:700px){
  .livewrap{min-height:70px}
}

/* ---------- gentle motion ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;opacity:.55}
.b1{width:44vmin;height:44vmin;top:-12vmin;inset-inline-end:-10vmin;
  background:radial-gradient(circle,rgba(156,195,232,.55),transparent 70%);
  animation:float1 26s ease-in-out infinite alternate}
.b2{width:38vmin;height:38vmin;bottom:-14vmin;inset-inline-start:-8vmin;
  background:radial-gradient(circle,rgba(168,86,111,.28),transparent 70%);
  animation:float2 34s ease-in-out infinite alternate}
.b3{width:30vmin;height:30vmin;top:38%;inset-inline-start:55%;
  background:radial-gradient(circle,rgba(62,111,168,.20),transparent 70%);
  animation:float3 42s ease-in-out infinite alternate}
@keyframes float1{from{transform:translate(0,0) scale(1)}to{transform:translate(-6vmin,7vmin) scale(1.12)}}
@keyframes float2{from{transform:translate(0,0) scale(1)}to{transform:translate(7vmin,-6vmin) scale(1.08)}}
@keyframes float3{from{transform:translate(0,0)}to{transform:translate(-8vmin,-5vmin)}}
.app,.scrim,.sheet{position:relative;z-index:1}
.sheet{z-index:50}.scrim{z-index:40}

.qtext{animation:qin .5s cubic-bezier(.2,.8,.2,1) backwards}
.optbtn{animation:qin .5s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes qin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.optbtn:not(.done):hover{transform:translateY(-1px);box-shadow:0 8px 18px -12px rgba(22,52,92,.3)}
.optbtn:not(.done):active{transform:scale(.985)}
.optbtn.right{animation:glowg 1.1s ease}
@keyframes glowg{0%{box-shadow:0 0 0 0 rgba(47,125,107,.35)}100%{box-shadow:0 0 0 14px rgba(47,125,107,0)}}
.optbtn.wrong{animation:softdip .5s ease}
@keyframes softdip{0%{transform:translateY(0)}35%{transform:translateY(2px)}100%{transform:none}}
.solbox{animation:rise .55s cubic-bezier(.2,.8,.2,1)}
.pmeta span:last-child{transition:.3s}
.score-pop{animation:pop .45s cubic-bezier(.2,.8,.2,1)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.18)}100%{transform:scale(1)}}
.expill{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,border-color .3s,background .3s}
.expill:hover{transform:translateY(-1px)}
.copybtn,.editbtn,.navb{transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s,background .28s,color .28s}
.editbtn:hover{transform:translateY(-1px)}
.navb:not(:disabled):active,.editbtn:active{transform:scale(.96)}
.tag{animation-duration:.45s}

/* ---------- guide sections ---------- */
.gsec{padding:13px 15px;margin-bottom:10px;border-radius:16px;background:rgba(255,255,255,.8);border:1px solid var(--line)}
.gsec p{margin:0;font-size:14px;line-height:1.9;color:var(--txt)}
.gsec .sollbl{margin-bottom:5px}
.gsec.gme{background:var(--sky-l);border-color:#CFE2F4}
.gsec.gq{background:rgba(255,255,255,.55);border-style:dashed}
.gsec.gq p{font-size:13px;color:var(--mut);line-height:1.75}
.gsec.gq .solopt{margin:4px 0;padding:2px 8px;border-radius:8px}
.gsec.gq .solopt b{color:var(--faint)}
.gsec.gq .solright{background:rgba(47,125,107,.09);color:var(--ok)}
.gsec.gq .solright b{color:var(--ok)}
.gsec.gq .solwrong{background:rgba(126,35,64,.07);color:var(--burg)}
.gsec.gq .solwrong b{color:var(--burg)}



.solbox.insol{margin-top:0;border:0;box-shadow:none;background:transparent}
/* ---------- prefs popover ---------- */
.pop{position:fixed;top:14%;left:50%;transform:translateX(-50%) scale(.92);z-index:50;
  width:min(320px,calc(100vw - 40px));background:linear-gradient(178deg,#FFFFFF 0%,var(--sky-xl) 100%);
  border-radius:22px;box-shadow:0 24px 70px -24px rgba(22,52,92,.5);padding:18px 20px 20px;
  opacity:0;pointer-events:none;transition:opacity .3s,transform .35s cubic-bezier(.2,.8,.2,1)}
.pop.on{opacity:1;pointer-events:auto;transform:translateX(-50%) scale(1)}
.pop-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.pop-head h3{flex:1;font-size:17px;font-weight:400}

  display:grid;place-items:center;font-size:13px;transition:.25s}
.pop-head .x:hover{background:var(--sky)}
.ava{display:block;width:84px;height:84px;border-radius:50%;margin:2px auto 14px;
  box-shadow:0 10px 26px -12px rgba(22,52,92,.45), 0 0 0 3px #fff, 0 0 0 4.5px var(--line);
  animation:rise .6s cubic-bezier(.2,.8,.2,1)}
.pop.popwide{width:min(560px,calc(100vw - 32px));top:7%;max-height:84vh;max-height:84dvh;
  display:flex;flex-direction:column;padding:16px 18px}

.popSave{width:100%;margin-top:16px;padding:12px 18px;font-size:14px}

/* ---------- warm ambience ---------- */

  animation:drop .7s .07s cubic-bezier(.2,.8,.2,1) backwards}

  display:flex;flex-wrap:wrap;gap:9px;align-content:flex-start;padding:10px 2px 16px}

  transition:transform .25s cubic-bezier(.2,.8,.2,1),background .3s,color .3s,border-color .3s,box-shadow .3s;
  animation:rise .5s cubic-bezier(.2,.8,.2,1) backwards}
.tag:hover{transform:translateY(-1px);border-color:var(--sky)}
.tag:active{transform:scale(.94)}
.tag.g{background:linear-gradient(135deg,#2F7D6B,#3E9682);border-color:transparent;color:#fff;
  box-shadow:0 8px 18px -10px rgba(47,125,107,.55)}
.tag.r{background:linear-gradient(135deg,var(--burg),#A03A57);border-color:transparent;color:#fff;
  box-shadow:0 8px 18px -10px rgba(126,35,64,.55)}

.legend .lg i{background:linear-gradient(135deg,#2F7D6B,#3E9682)}
.legend .lr i{background:linear-gradient(135deg,var(--burg),#A03A57)}
.legend .ln i{background:#fff;border:1px solid var(--line)}
.bar{flex:0 0 auto;display:flex;gap:9px;animation:drop .7s .14s cubic-bezier(.2,.8,.2,1) backwards}

  border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:12px 16px 13px;
  box-shadow:0 14px 38px -24px rgba(22,52,92,.35);
  animation:drop .7s .08s cubic-bezier(.2,.8,.2,1) backwards}
.liveh{flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:7px}
.livebox{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;
  font-size:12.5px;line-height:1.8;color:var(--txt);white-space:pre-wrap;

@keyframes flashIn{from{background:rgba(126,35,64,.10)}to{background:transparent}}

 "ד": "בהכרח אין ל-X תחליפים טובים.", "ה": "עקומת ההיצע של X יורדת משמאל לימין."}, "a": "א"}, {"n": 8, "ex": "05/2023", "q": "על X (משק סגור, תחרות משוכללת) מוטל מס 10 ש\"ח ליחידה. הוחלט להוריד ל-5 ש\"ח. עקומות רגילות. מה יקרה?", "o": {"א": "תקבולי הממשלה מהמס חייבים לגדול.", "ב": "תקבולי הממשלה יירדו בכל מקרה.", "ג": "רק אם ידוע שהתקבולים ירדו, ניתן לומר שמצב הצרכנים השתפר.", "ד": "רק אם ידוע שהתקבולים ירדו, ניתן לומר שמצב היצרנים השתפר.", "ה": "אם הוצאות הצרכנים על X לא השתנו אחרי ההורדה — התקבולים בהכרח יירדו."}, "a": "ה"}, {"n": 9, "ex": "05/2023", "q": "X מיוצר מקומית + יבוא חופשי במחיר עולמי. המשק קטן. הממשלה רוצה לעודד ייצור מקומי: (I) סובסידיה לכל יחידה מיוצרת; (II) מכס על כל יחידה מיובאת. גובה המכס שווה לסובסידיה, ובכל מקרה יישאר יבוא. איזה משפט נכון ביותר?", "o": {"א": "מבחינת הוצאות הממשלה — אין הבדל.", "ב": "מבחינת הצרכנים — אין הבדל.", "ג": "הוצאות הסובסידיה גדולות יותר ככל שהביקוש המקומי קשיח יותר.", "ד": "מבחינת היצרנים המקומיים — אין הבדל בין השיטות.", "ה": "הוצאות הסובסידיה גדולות יותר ככל שההיצע המקומי קשיח יותר."}, "a": "ד"}, {"n": 10, "ex": "05/2023", "q": "מגדלים פרחים בתחרות משוכללת, נצרכים מקומית וגם מיוצאים במחיר בינלאומי. הובלה אווירית משמעותית. המשק קטן. מחירי התובלה התייקרו מאוד. מה צפוי בענף?", "o": {"א": "הכמות המיוצרת לא תשתנה, אבל היצוא יקטן בהכרח.", "ב": "הכמות המיוצרת והמיוצאת יקטנו בהכרח; השיווק המקומי יגדל בהכרח.", "ג": "היצוא יקטן, השיווק המקומי יגדל, לא ניתן לדעת מה יקרה לכמות המיוצרת.", "ד": "אם גמישות הביקוש המקומי גדולה מ-1, הכמות המיוצרת תגדל.", "ה": "הכמות המיוצרת תקטן רק אם גמישות ההיצע גבוהה מ-1."}, "a": "ב"}, {"n": 11, "ex": "05/2023", "q": "הצריכה של משפחה גבוהה מההכנסה הפנויה שלה. איזה משפט נכון (בתחום הרלוונטי)?", "o": {"א": "הנטייה השולית לצרוך גדולה מ-1.", "ב": "הנטייה הממוצעת לצרוך גדולה מ-1.", "ג": "הנטייה השולית לחסוך קטנה מ-0.", "ד": "סכום הנטייה הממוצעת לצרוך והממוצעת לחסוך גדול מ-1.", "ה": "סכום הנטייה השולית לצרוך והשולית לחסוך קטן מ-1."}, "a": "ב"}, {"n": 12, "ex": "05/2023", "q": "נתוני משק: תוצר לאומי נקי 8 00; יבוא 2,500; העברות שהמשק העביר לחו\"ל 800; השקעות תושבים בחו\"ל 500; הלוואות לזמן ארוך שהתקבלו מחו\"ל 700 (מיליוני דולרים). אין הלוואות לזמן קצר. איזה היגד נכון ביותר?", "o": {"א": "עודף היבוא 1,500, גירעון החשבון השוטף 2,300, ויתרות המט\"ח ירדו ב־2,100.", "ב": "עודף היבוא 2,300 ויתרות המט\"ח ירדו ב־1,100.", "ג": "גירעון החשבון השוטף 700 והיתרות לא השתנו.", "ד": "עודף היבוא 1,500 והיתרות גדלו ב־500.", "ה": "גירעון החשבון השוטף 2,300 והיתרות ירדו ב־900."}, "a": "א"}, {"n": 17, "ex": "02/2024", "q": "נתונים (מיליארדי ש\"ח): השקעה מקומית נקייה 80; יבוא 70; יצוא 40; גירעון תקציב הממשלה 16. הפירמות חילקו את כל רווחיהן. מה גודל החיסכון האישי?", "o": {"א": "48 מיליארד.", "ב": "50 מיליארד.", "ג": "96 מיליארד.", "ד": "64 מיליארד.", "ה": "66 מיליארד."}, "a": "ה"}, {"n": 18, "ex": "02/2024", "q": "פיקדונות עו\"ש: 20 מיליארד; יחס רזרבה 25% (מקוים תמיד); הציבור מחזיק מזומן קבוע של 10 מיליארד. הבנק המרכזי רכש מהבנקים אג\"ח ממשלתיות ב־5 מיליארד. מה יקרה לאמצעי התשלום?", "o": {"א": "לא ישתנו.", "ב": "יגדלו ב־20 מיליארד.", "ג": "יגדלו ב־25 מיליארד.", "ד": "יקטנו ב־25 מיליארד.", "ה": "יגדלו ב־5 מיליארד."}, "a": "ב"}, {"n": 19, "ex": "02/2024", "q": "נתונים: נטייה שולית לצרוך מההכנסה הפנויה 0.5; נטייה שולית להשקיע מהתוצר 0.3; נטייה שולית לייבא מהתוצר 0.1; מס הכנסה 20% מהתוצר. שער הריבית והמחירים קבועים. הממשלה מטילה מס קבוע נוסף של 100 על משקי הבית. מה השינוי בצריכה הפרטית?", "o": {"א": "50 ש\"ח.", "ב": "62.5 ש\"ח.", "ג": "112.5 ש\"ח.", "ד": "100 ש\"ח.", "ה": "40 ש\"ח."}, "a": "ד"}, {"n": 20, "ex": "02/2024", "q": "איזה מהסעיפים הבאים כלול בחישוב התוצר הלאומי?", "o": {"א": "מענקי ילדים ששילמה הממשלה.", "ב": "מכירת מכונה משומשת מחברת עלית לחברת אוסם.", "ג": "תשלומי שכר לעובדי הממשלה.", "ד": "פידיון קרן של איגרות חוב ממשלתיות.", "ה": "מכירת אג\"ח לציבור על ידי הבנק המרכזי."}, "a": "ג"}];

const SOL={"09/2024-1": "עקומת תמורה קמורה פירושה עלות אלטרנטיבית שגדלה עם הכמות. בנקודה הנוכחית יחידת X נוספת עולה 1Y — אבל היחידות הבאות יעלו יותר. לכן שתי יחידות X נוספות יגרעו יותר מ־2 יחידות Y, ו־Y יקטן מתחת ל־454. התשובה: ג.", "09/2024-2": "יעילות בהקצאה נמדדת בעלות אלטרנטיבית, לא בתפוקה מוחלטת: מקצים לייצור X קודם את הפועלים שמוותרים על הכי מעט Y. זה בדיוק עקרון היתרון היחסי. התשובה: ד.", "09/2024-3": "השכר נקבע לפי ערך התפוקה השולית של העובד האחרון. ערכי התפוקה השולית (במחיר 4,000 לטון): חלקות A — 400, 320, 200, 160 אלף; חלקות B — 360, 280, 200, 80 אלף. מאיישים מהגבוה לנמוך: 50 ראשונים ב־A (400), 50 ב־B (360), 50 שניים ב־A (320) — 150 עובדים; 30 הנותרים נכנסים שניים ב־B (280 אלף). העובד השולי מייצר 280,000 ש\"ח — וזה השכר. התשובה: א.", "09/2024-4": "תפוקה כוללת = ממוצעת × עובדים: 20, 60, 120, 176, 200, 210, 217. הפדיון (מחיר 1) פחות שכר 50n נותן במקרה הטוב מינוס 24 (עם 4 פועלים) — הפסד בכל היקף העסקה. אין הוצאות קבועות, ולכן סגירה נותנת אפס — עדיף מכל הפסד. התשובה: ב.", "09/2024-5": "מכס מעלה את מחיר הצרכן, ולכן מצמצם יבוא בשני ערוצים: הצריכה יורדת וגם הייצור המקומי גדל. סובסידיה משאירה את מחיר הצרכן במקומו — כל הצמצום חייב לבוא מהגדלת ייצור בלבד. כדי להשיג אותו צמצום, הסובסידיה ליחידה חייבת להיות גבוהה מהמכס. התשובה: ה.", "09/2024-6": "פירמה תחרותית מייצרת בנקודה שבה MC עולה וחותך את המחיר מלמטה (התנאי השני למקסימום רווח). באזור שבו MC יורד, כל יחידה נוספת זולה מקודמתה — אין שם שיווי משקל. התשובה: ג.", "09/2024-7": "המחיר המקומי במוצא: 80 + 20 = 100. ההובלה הוכפלה ל־40, המחיר עלה ל־120 — עלייה של 20%. גמישות 0.5 → הכמות יורדת ב־10%: מ־2,000 ל־1,800 יחידות. התשובה: ה.", "09/2024-8": "במשק קטן המחיר העולמי נתון, ולכן גם מכס וגם מס צריכה באותו גובה מעלים את מחיר הצרכן באותו סכום — אותה ירידה בצריכה (א). הרשות קיבלה רשמית גם את ב, שכן מס על כלל הצריכה חל גם על התוצרת המקומית ומבטיח את הצמצום המרבי בכל תרחיש. שתי התשובות התקבלו במפתח הרשמי — מקרה נדיר ושווה היכרות.", "09/2024-9": "הוצאה קבועה של 120,000 זוז = ביקוש בגמישות יחידתית. במחיר מינימום 12: הצרכנים קונים 10,000 ק\"ג, הייצור 15,000, והממשלה קונה ומשמידה 5,000 × 12 = 60,000. בסובסידיה של 4: היצרן מקבל 12 ומייצר 15,000; הצרכנים קונים הכול ב־8 (120,000 ÷ 15,000); עלות הממשלה 4 × 15,000 = 60,000 — זהה. אותה עלות, בלי השמדה, והצרכנים מקבלים יותר בזול. התשובה: ד.", "09/2024-10": "שיפור טכנולוגי מגדיל את היצע X ומוריד את מחירו. Y תחליפי — הביקוש אליו קטן, מחירו וכמותו יורדים, ולכן פדיון יצרני Y יורד בוודאות. פדיון יצרני X יעלה רק אם הביקוש ל־X גמיש (גדול מ־1). התשובה: א.", "09/2024-11": "המסים: T = G − גירעון = 600 − 300 = 300. הכנסה פנויה = תוצר − מסים − רווחים שלא חולקו = 1,500 − 300 − 150 = 1,050. התשובה: ג.", "09/2024-12": "המפתח: הממשלה שומרת תמיד על תקציב מאוזן, ולכן כל שקל מס נוסף (0.25 מכל שקל תוצר) חוזר כהוצאה. שיפוע הביקוש: 0.6 (צריכה: 0.8×0.75) + 0.05 (השקעה) + 0.25 (הוצאת המסים) = 0.9 → מכפיל 10 → התוצר גדל ב־1,000. ההכנסה הפנויה גדלה ב־750 והחיסכון האישי ב־0.2 × 750 = 150. המימון הראשוני במילווה — הגירעון 100. התשובה: ד.", "09/2024-13": "כשמצפים לירידת ריבית, מחירי האג\"ח צפויים לעלות — עדיף להחזיק אג\"ח היום וליהנות מרווח ההון. התשובה: א.", "09/2024-14": "התוצר גדל: 5 × 300 = 1,500. היבוא גדל לפי הנטייה השולית לייבא: 0.1 × 1,500 = 150. היצוא לא תלוי בתוצר — עודף היבוא גדל ב־150. התשובה: ב.", "09/2024-15": "הזהות: חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + החשבון השוטף. עם עודף יבוא החשבון השוטף שלילי, ואם החיסכון הפרטי גדול מההשקעה — נובע בהכרח שחיסכון הממשלה שלילי. התשובה: ה.", "09/2024-16": "מסים מעל ההוצאה מקטינים את הביקוש המצרפי → אבטלה. פירעון חוב לבנק המרכזי משמיד בסיס כסף (הכסף חוזר לבנק המרכזי ונעלם מהמחזור) → כמות אמצעי התשלום קטנה. התשובה: ג.", "09/2024-17": "חשבון שוטף + חשבון הון = השינוי ברזרבות. החשבון השוטף = סחורות ושירותים + העברות (3), חשבון ההון = ‎−0.5. לכן: ס\"ש + 3 − 0.5 = 1 → סחורות ושירותים = ‎−1.5 — עודף יבוא של 1.5 מיליארד. התשובה: א.", "09/2024-18": "שיפוע הביקוש: 0.8 × 0.75 = 0.6 → מכפיל 2.5. ביקוש אוטונומי: 900 + 300 + 800 = 2,000 → תוצר שיווי משקל 5,000 — אבטלה (תעסוקה מלאה ב־6,000). מסים: 0.25 × 5,000 = 1,250; הוצאה 800 → עודף 450. התשובה: ב.", "09/2024-19": "הציבור הפקיד 0.5 מיליארד מזומן: הפיקדונות מתרחבים פי 4 (יחס רזרבה 25%) = ‎+2 מיליארד, המזומן ‎−0.5 → אמצעי התשלום גדלים ב־1.5 מיליארד. לקיזוז: מכירת אג\"ח לבנקים ב־0.375 מקטינה רזרבות, והפיקדונות מתכווצים 0.375 × 4 = 1.5 מיליארד. התשובה: ד.", "09/2024-20": "תשלומי העברה (קצבאות) אינם תמורת שירות ואינם חלק מהצריכה הציבורית — אבל הם כן בתקציב ומשפיעים על הגירעון. אצל משקי הבית הם נכנסים להכנסה הפנויה. התשובה: ה.", "05/2023-1": "שימי לב להגדרה בשאלה: \"רווח\" = פדיון פחות הוצאות משתנות. גם המחיר וגם השכר יורדים 20% — עקומת MC יורדת באותו יחס כמו המחיר, ולכן הכמות האופטימלית לא משתנה. הפדיון וההוצאות המשתנות יורדים שניהם 20%, ולכן גם ההפרש ביניהם יורד בדיוק 20%. התשובה: ה.", "05/2023-2": "יתרון יחסי נקבע לפי עלות אלטרנטיבית, ונתון אחד (מקסימום טרקטורים) לא מספיק. רק כשנוסף המידע שההר חזק יותר בחיטה, אפשר לחשב: העלות האלטרנטיבית של חיטה נמוכה יותר בהר → יתרון יחסי בחיטה. התשובה: ד.", "05/2023-3": "העיקרון: שווי החלפת חלקה לשנה = הפרש הרנטות (פדיון החלקה פחות שכר הפועלים) בין חלקת גזר לחלקת חיטה בשיווי משקל, כשהשכר נקבע לפי התפוקה השולית של העובד ה־75 במשק. לפי המפתח הרשמי ההפרש הוא 2,000 ש\"ח. זו השאלה החישובית הכבדה של המועד — אם הדרך לא יושבת, זה מקרה מצוין לכפתור \"פתרון מלא צעד־צעד\" עם עוזר, שיפרק את שלב קביעת השכר. התשובה: א.", "05/2023-4": "מכסה ומכס שמצמצמים את היבוא לאותה כמות מעלים את המחיר המקומי לאותה רמה בדיוק. ההבדל היחיד: במכס הפרש המחיר נכנס לקופת הממשלה, במכסה — לכיסם של בעלי רישיונות היבוא. התשובה: ב.", "05/2023-5": "זהו \"פרדוקס היבול\": כשהביקוש קשיח (גמישות קטנה מ־1), ירידת מחיר מקטינה את הפדיון. ההיצע גדל → המחיר צונח → הפדיון קטן, וההוצאות כמעט לא השתנו → הכנסת המגדלים יורדת דווקא בשנה טובה. התשובה: ג.", "05/2023-6": "היצע העולים (קשיח) מתווסף להיצע הוותיקים → ההיצע הכולל זז ימינה והשכר יורד. בשכר הנמוך חלק מהוותיקים — שעל עקומת היצע עולה — בוחרים לפרוש, ואילו העולים עובדים בכל שכר ולכן כולם מועסקים. התשובה: ג.", "05/2023-7": "שני השינויים: ירידת הכנסה מגדילה ביקוש רק אם המוצר נחות; התייקרות חומרי גלם מקטינה היצע — זה מעלה מחיר ומקטין כמות. הצריכה גדלה בכל זאת → בהכרח הביקוש גדל בגלל ירידת ההכנסה → X מוצר נחות. התשובה: א.", "05/2023-8": "המס ירד מ־10 ל־5, כלומר המחיר לצרכן יורד לכל היותר ב־5 — ונשאר מעל מחצית המחיר הקודם. אם ההוצאה (מחיר × כמות) לא השתנתה, הכמות גדלה פחות מפי שניים, בעוד המס ליחידה ירד בדיוק פי שניים → תקבולי המס בהכרח קטנו. התשובה: ה.", "05/2023-9": "מנקודת ראות היצרן המקומי, גם סובסידיה וגם מכס באותו גובה מעלים את המחיר שהוא מקבל בדיוק באותו סכום (מעל המחיר העולמי) → אותו ייצור מקומי, אותו רווח. ההבדל הוא אצל הצרכנים (רק המכס מייקר להם) ובקופת הממשלה. התשובה: ד.", "05/2023-10": "היצואן מקבל את המחיר העולמי פחות ההובלה — ההתייקרות מורידה את המחיר נטו שלו. לכן הייצור קטן, המחיר המקומי (שמתיישר עם מחיר היצואן) יורד והצריכה המקומית גדלה — והיצוא נלחץ משני הכיוונים. התשובה: ב.", "05/2023-11": "צריכה גבוהה מההכנסה הפנויה פירושה שהיחס C/Yd גדול מ־1 — הנטייה הממוצעת לצרוך גדולה מ־1 (המשפחה \"אוכלת\" מחסכונות או מהלוואות). על הנטיות השוליות אי אפשר להסיק דבר, והשוליות ממילא מסתכמות תמיד בדיוק ל־1. התשובה: ב.", "05/2023-12": "השקעה נקייה של המשק = השקעה מקומית − עודף יבוא: ‎−200 = השקעה מקומית − 1,000 → השקעה מקומית 800. מהזהות: 8,800 = 4,000 + 800 + G − 1,000 → G = 5,000. מסים: G + העברות − גירעון = 5,000 + 400 − 700 = 4,700. הכנסה פנויה = 8,800 − 4,700 + 400 = 4,500. התשובה: ג.", "05/2023-13": "משיכת 50,000 מהפיקדונות מכווצת אותם פי 4 (יחס רזרבה 25%): פיקדונות ‎−200,000, מזומן ‎+50,000 → אמצעי תשלום ‎−150,000. קניית אג\"ח מהציבור ב־37,500 מזרימה פיקדונות שמתרחבים פי 4 = ‎+150,000 — קיזוז מדויק. התשובה: ה.", "05/2023-14": "העלאת ריבית פועלת פעמיים: מרסנת את הביקוש המקומי, וגם מושכת הון מחו\"ל → היצע המט\"ח גדל, השקל מתחזק, היבוא מוזל — וזה מרסן את המחירים עוד. השפעה כפולה נגד האינפלציה. התשובה: א.", "05/2023-15": "אם הצריכה הפרטית לבדה גדולה מהתוצר, החיסכון הלאומי (תוצר פחות צריכה פרטית וציבורית) שלילי בהכרח — וההשקעה הנקייה של המשק שווה לחיסכון הלאומי, כלומר קטנה מ־0. ההשקעה המקומית דווקא יכולה להיות חיובית, אם מממנים אותה בעודף יבוא. התשובה: ד.", "05/2023-16": "פער אינפלציוני נמדד ברמת התעסוקה המלאה: עודף הביקוש שם = (5,000 − 4,000) × (1 − 0.6) = 400 ש\"ח. שימי לב: הפער אינו כל ההפרש בתוצר (1,000) אלא רק החלק שהמכפיל לא סוגר. התשובה: א.", "05/2023-17": "בתעסוקה מלאה אין מקורות פנויים. עידוד השקעה בלבד ייצור לחץ אינפלציוני, והגדלת חיסכון בלבד תיצור אבטלה. חייבים לשלב: להגדיל את החיסכון המתוכנן (מפנה מקורות) ובמקביל, באותו סכום, את ההשקעה המתוכננת. התשובה: ד.", "05/2023-18": "סחורות ושירותים: יצוא 5,500 − יבוא סחורות (3,200 + 3,000 הציוד שהתקבל במתנה — גם הוא יבוא!) − ריבית 400 = גירעון 1,100. החשבון השוטף: ‎−1,100 + 3,000 העברות = עודף 1,900. חשבון ההון: ‎+1,600 הלוואה − 1,000 פירעון = ‎+600 → הרזרבות גדלו ב־2,500. הטריק: לזכור שמתנה נרשמת פעמיים — יבוא והעברה. התשובה: ב.", "05/2023-19": "העברת שקל מעשיר לעני מגדילה צריכה רק אם לשניהם אותה פונקציית צריכה והנטייה השולית לצרוך פוחתת עם ההכנסה — אז אצל העני כל שקל \"שווה\" יותר צריכה. בלי שתי ההנחות יחד אין הכרח. התשובה: ה.", "05/2023-20": "הזהות: חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + (יצוא − יבוא). עם עודף יצוא (חיובי) והשקעה גדולה מהחיסכון הפרטי — חיסכון הממשלה חייב להיות חיובי, כלומר עודף תקציבי. התשובה: ג.", "02/2024-1": "במשק קטן המחיר נקבע בעולם — הוא לא זז. בשיפור טכנולוגי ההיצע המקומי גדל באותו מחיר, ולכן היבוא (500) מתכווץ, וייתכן שהמשק יהפוך ליצואן. התשובה: ב.", "02/2024-2": "ערך התפוקה השולית: 500, 300, 240, 160, 100, 50 טון × 20 ש\"ח = 10,000; 6,000; 4,800; 3,200; 2,000; 1,000. מעסיקים כל עוד הערך ≥ שכר (1,800): הפועל החמישי מוסיף 2,000 — משתלם; השישי מוסיף 1,000 — הפסד. חמישה פועלים. התשובה: ד.", "02/2024-3": "עלות הממשלה = סובסידיה ליחידה × כל הייצור. כששני הצדדים גמישים, מספיק פער מחירים קטן כדי להזיז כמות גדולה — הסובסידיה הנדרשת ליחידה קטנה, וההוצאה הכוללת קטנה. התשובה: א.", "02/2024-4": "בפרי, לפועלי א' עלות אלטרנטיבית של 2 טון חיטה לטון פרי ולפועלי ב' 4 — לכן פרי מייצרים קודם עם א'. 3,000 טון פרי בתוך הקיבולת של א' (עד 5,000), והשולי הוא פועל א' — עלות 2 טון חיטה. התשובה: ג.", "02/2024-5": "היצואן מקבל את המחיר העולמי פחות ההובלה — ההתייקרות מורידה את מחירו נטו, והמחיר המקומי מתיישר אליו. לכן: ייצור קטן, יצוא קטן, וצריכה מקומית גדלה (המחיר ירד). כל ארבעת הכיוונים ידועים. התשובה: ה.", "02/2024-6": "היצע הנעליים זז ימינה (תשומה הוזלה) — לבדו מגדיל כמות. אם הכמות בכל זאת ירדה, הביקוש חייב היה לזוז שמאלה — וירידת ביקוש כשההכנסה עולה היא ההגדרה של מוצר נחות. התשובה: ג.", "02/2024-7": "ההוצאה הממוצעת עד כה: 2 טון לתותח × 100 = 200 טון שהוקרבו → מיוצרים 800 טון תפוזים. בעקומה קמורה העלות השולית עולה — 50 התותחים הבאים יעלו יותר מ־2 טון כל אחד, כלומר יותר מ־100 טון → פחות מ־700. התשובה: ד.", "02/2024-8": "שני תנאים: MC בעלייה (תנאי שני למקסימום), ו־P ≥ AVC כדי שלא עדיף לסגור. כאשר AVC בעלייה, MC נמצא מעליה — והמחיר (=MC) מכסה את ההוצאה המשתנה. התשובה: א.", "02/2024-9": "היבוא = ביקוש פחות היצע מקומי. הצריכה ירדה 300 והיבוא ירד 600 → הייצור המקומי גדל ב־300. אותם שינויים מוחלטים, אותו שינוי מחיר — אבל בסיס הביקוש גדול מבסיס ההיצע (יש יבוא!), ולכן אחוז השינוי של הביקוש קטן יותר → גמישות הביקוש קטנה בהכרח. התשובה: ב.", "02/2024-10": "סובסידיה לייצור: היצרנים מקבלים יותר (מרוצים), ומחיר הצרכן לא זז (אין התנגדות). מכס ומס צריכה מייקרים לצרכן. לכן האמצעי היחיד שמקובל על שניהם הוא זה שפועל ישירות על הגדלת הייצור. התשובה: ה.", "02/2024-11": "תוצר לאומי נקי = שכר + ריבית + דיבידנד + רווחים שלא חולקו + מס חברות = 5,200. תקציב: מסים (400 + 1,400) פחות העברות (400) פחות צריכה ציבורית (1,600) = גירעון 200. חיסכון לאומי = אישי 800 + עסקי 600 + ממשלתי ‎−200 = 1,200; השקעה מקומית = 1,200 + עודף יבוא 400 = 1,600. התשובה: ב.", "02/2024-12": "הזהות: חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + (יצוא − יבוא). נתון שההשקעה קטנה מהחיסכון הפרטי; אם יש עודף יבוא (שלילי) — חיסכון הממשלה חייב להיות שלילי, כלומר גירעון בהכרח. התשובה: ה.", "02/2024-13": "פיחות מוזיל את היצוא ומייקר את היבוא — הביקוש המצרפי גדל (תוצר עולה) וחשבון הסחר משתפר בו־זמנית. כל שאר הכלים משיגים מטרה אחת על חשבון השנייה. התשובה: ד.", "02/2024-14": "פער דפלציוני 500 פירושו שברמת 10,000 הביקוש חסר 500. המכפיל: 1/(1−0.75) = 4 → שיווי המשקל נמוך ב־4 × 500 = 2,000 → תוצר 8,000, באבטלה. התשובה: ג.", "02/2024-15": "כדי לפנות מקום ל־500 של ביטחון בלי אינפלציה, הצריכה הפרטית חייבת לרדת ב־500 בדיוק. מס מקטין צריכה רק בחלק (לפי הנטייה השולית לצרוך) — לכן נדרש מס גדול מ־500, מכויל כך שהצריכה תרד ב־500. התשובה: א.", "02/2024-16": "סחורות ושירותים: 1,000 − 2,500 = עודף יבוא 1,500. חשבון שוטף: ‎−1,500 − 800 העברות ששולמו = גירעון 2,300. הון: ‎+700 הלוואות − 500 השקעות בחו\"ל = ‎+200 → היתרות ירדו ב־2,100. התשובה: א.", "02/2024-17": "חיסכון לאומי = השקעה מקומית + (יצוא − יבוא) = 80 + (40 − 70) = 50. חיסכון לאומי = אישי + עסקי (0, הכול חולק) + ממשלתי (‎−16) → אישי = 50 + 16 = 66 מיליארד. התשובה: ה.", "02/2024-18": "רכישת אג\"ח מהבנקים מזרימה 5 מיליארד לרזרבות. עם יחס רזרבה 25% הפיקדונות מתרחבים פי 4: ‎+20 מיליארד. המזומן קבוע — אמצעי התשלום גדלים ב־20 מיליארד. התשובה: ב.", "02/2024-19": "שיפוע הביקוש: צריכה 0.5 × 0.8 = 0.4, ועוד השקעה 0.3, פחות יבוא 0.1 → 0.6 → מכפיל 2.5. הזעזוע: מס קבוע 100 מקטין צריכה ראשונית ב־50 → התוצר יורד 125. ההכנסה הפנויה: ‎−125 × 0.8 − 100 = ‎−200 → הצריכה יורדת 0.5 × 200 = 100 ש\"ח. התשובה: ד.", "02/2024-20": "בתוצר נכללת תמורה בעד ייצור שוטף. שכר עובדי ממשלה הוא רכישת שירות עבודה — חלק מהצריכה הציבורית. העברות, נכסים משומשים ועסקאות פיננסיות — בחוץ. התשובה: ג."};

const GTYPES={"ppf": {"t": "שאלות עקומת התמורה בודקות עלות אלטרנטיבית — כמה מהמוצר השני מקריבים עבור יחידה נוספת, ומי צריך לייצר מה.", "r": "עלות אלטרנטיבית = הוויתור. עקומה קמורה = העלות השולית עולה עם הכמות. יתרון יחסי = עלות אלטרנטיבית נמוכה — ומשווים תמיד יחסים, לא כמויות.", "z": "כתבי לכל גורם ייצור את היחס \"כמה Y עולה X אחד\". אם מופיעה המילה \"ממוצעת\" — עצרי והפרידי בין ממוצע לשולי."}, "labor": {"t": "שאלות העסקה ותפוקה שולית: כמה עובדים להעסיק, ומה השכר שנקבע בשוק תחרותי.", "r": "מעסיקים כל עוד ערך התפוקה השולית (תפוקה שולית × מחיר) גבוה מהשכר. השכר בשוק = ערך התפוקה של העובד האחרון שנקלט. ואם הכול מפסיד — סגירה נותנת אפס.", "z": "בני מיד עמודת תפוקה שולית מהפרשי הטבלה וכפלי במחיר — נשארת השוואה פשוטה מול השכר."}, "firm": {"t": "שאלות עלויות הפירמה: איפה מייצרים, מתי סוגרים, ואילו אזורים בלתי אפשריים.", "r": "מקסימום רווח: P=MC כאשר MC עולה. מחיר מתחת ל־AVC — סוגרים. MC חותך את AVC במינימום שלה, ולכן AVC עולה פירושו MC מעליה.", "z": "שרטוט זעיר של MC ו־AVC בצורת U פותר את רוב הבלבולים בשניות."}, "elast": {"t": "שאלות גמישות: איך אחוז שינוי במחיר מתורגם לכמות, לפדיון ולתקבולי מס.", "r": "אחוז שינוי בכמות = גמישות × אחוז שינוי במחיר. גמישות קטנה מ־1: המחיר יורד ⇒ הפדיון יורד. גמישות משווה אחוזים — הבסיס שממנו מחשבים קובע.", "z": "עבדי באחוזים מהמצב ההתחלתי, ורק בסוף חזרי לכמויות."}, "trade": {"t": "שאלות התערבות במשק קטן: מכס, סובסידיה, מכסה או מס צריכה — ומי מרוויח ומי מפסיד.", "r": "משק קטן = המחיר העולמי קבוע. מכס מייקר לצרכן ומיטיב עם היצרן; סובסידיה מיטיבה עם היצרן בלי לגעת בצרכן; מכסה כמו מכס אך ההפרש הולך ליבואנים; מס צריכה פוגע בצרכן בלי להיטיב עם היצרן.", "z": "לכל כלי בדקי שני מחירים בלבד: מה מקבל היצרן ומה משלם הצרכן. כל השאר נגזר מזה."}, "exportp": {"t": "שאלות יצוא עם הוצאות הובלה: המחיר שהיצואן מקבל בפועל הוא שמכתיב את השוק המקומי.", "r": "מחיר יצואן נטו = מחיר עולמי − הובלה. הובלה מתייקרת ⇒ המחיר המקומי יורד, הייצור קטן, הצריכה המקומית גדלה, והיצוא נלחץ משני הצדדים.", "z": "עקבי אחרי מספר אחד — המחיר נטו — וכל ארבעת הכיוונים נופלים למקום."}, "shifts": {"t": "שאלות שני כוחות בשוק אחד: לזהות איזו עקומה זזה, לאן, ומה אפשר להסיק בוודאות.", "r": "היצע שזז מזיז מחיר וכמות לכיוונים מנוגדים; ביקוש שזז — לאותו כיוון. מסקנה \"בהכרח\" קיימת רק כשהתוצאה סותרת את אחד הכוחות. הכנסה עולה וצריכה יורדת = מוצר נחות.", "z": "ציירי חיצים לכל כוח בנפרד — מה הוא עושה למחיר ומה לכמות — ואז בדקי איזו תוצאה מכריעה."}, "minprice": {"t": "שאלות התערבות במחירים: מחיר מינימום, עודפים, וסובסידיה כחלופה.", "r": "מחיר מינימום יוצר עודף שמישהו חייב לקנות; סובסידיה משיגה ייצור דומה בלי השמדה. עלות ממשלה = סכום ליחידה × כמות.", "z": "אם ההוצאה הצרכנית קבועה — הביקוש בגמישות יחידתית: כמות = הוצאה ÷ מחיר."}, "natacc": {"t": "שאלות חשבונאות לאומית: זהויות שסוגרות את כל הנעלמים בזו אחר זו.", "r": "תוצר = C + I + G + (יצוא − יבוא). חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + (יצוא − יבוא). השקעה לאומית = מקומית − עודף יבוא. גירעון = הוצאות + העברות − מסים.", "z": "אלה שאלות הצבה, לא תובנה: כתבי את הזהות, הציבי נתונים, וסמני את הנעלם."}, "consume": {"t": "שאלות פונקציית הצריכה: ההבדל בין נטייה ממוצעת לשולית ומה נובע ממנו.", "r": "נטייה ממוצעת = C ÷ Yd. הממוצעות (צריכה+חיסכון) מסתכמות תמיד בדיוק ל־1, וכך גם השוליות. נתון על רמות לא מלמד דבר על שוליים.", "z": "כתבי את ההגדרה לפני שאת מחשבת — רוב המסיחים מבלבלים בכוונה בין ממוצע לשולי."}, "keynes": {"t": "שאלות המודל הקיינסיאני: מכפיל, פערים, ומדיניות תקציבית.", "r": "מכפיל = 1 ÷ (1 − שיפוע). השיפוע אוסף הכול: צריכה×(1−מס) + השקעה מושרית − יבוא שולי (ומס שחוזר כהוצאה, אם התקציב תמיד מאוזן). פער נמדד בנקודת התעסוקה המלאה — לא הפרש התוצר.", "z": "תמיד באותו סדר: שיפוע ⇒ מכפיל ⇒ זעזוע התחלתי ⇒ הכפלה אחת."}, "money": {"t": "שאלות בנק מרכזי וכסף: רזרבות, מכפיל פיקדונות וקיזוזים מדויקים.", "r": "אמצעי תשלום = מזומן + עו\"ש. שינוי ברזרבות מתגלגל: פיקדונות משתנים פי (1 ÷ יחס הרזרבה). קנייה מהציבור ≠ קנייה מהבנקים — עקבי אחרי המזומן.", "z": "נהלי שתי שורות — מזומן ופיקדונות — ורשמי מי גדל ומי קטן בכל צעד."}, "bonds": {"t": "שאלות אג\"ח וריבית: הקשר ההופכי ומה עושים עם ציפיות.", "r": "מחיר אג\"ח והריבית נעים הפוך. ציפייה לירידת ריבית ⇒ מחירי אג\"ח יעלו ⇒ כדאי להחזיק אג\"ח כבר עכשיו.", "z": "תרגמי כל ציפייה לריבית למשפט \"מה יקרה למחיר האג\"ח\" — והבחירה מתבהרת."}, "bop": {"t": "שאלות מאזן התשלומים: שלושה חשבונות שחייבים להסתכם לשינוי ברזרבות.", "r": "סחורות ושירותים ← בתוספת העברות = חשבון שוטף ← בתוספת חשבון ההון = שינוי ברזרבות. מתנה נרשמת פעמיים: גם יבוא וגם העברה.", "z": "בני טבלה של שלוש שורות ומלאי לפי הסדר — אל תקפצי ישר לתשובה."}, "gdpdef": {"t": "שאלות הגדרת התוצר: מה נחשב ייצור שוטף ומה נשאר בחוץ.", "r": "בתוצר נכללת רק תמורה בעד ייצור שוטף. בחוץ: תשלומי העברה, נכסים יד־שנייה, עסקאות פיננסיות. שכר עובדי ממשלה = צריכה ציבורית — כן בתוצר.", "z": "שאלי על כל סעיף: האם נוצר כאן משהו השנה?"}, "labmkt": {"t": "שאלות שוק העבודה: תוספת היצע ומי מגיב אליה.", "r": "היצע נוסף מוריד את השכר. עובדים על עקומת היצע עולה מצמצמים עבודה מרצון; היצע קשיח עובד בכל שכר — ולכן נקלט כולו.", "z": "בדקי כל קבוצה לפי צורת ההיצע שלה: גמיש מגיב, קשיח נשאר."}};

const HINT={"09/2024-1": "בעקומה קמורה העלות האלטרנטיבית גדלה עם הכמות. הנתון \"1 יחידת Y\" נכון לנקודה הנוכחית בלבד — שאלי את עצמך: היחידה הבאה של X תעלה יותר או פחות מזה? ומה זה אומר על שתי יחידות?", "09/2024-2": "\"יעיל\" פירושו לוותר על הכי מעט. אל תסתכלי כמה X כל פועל מייצר — תסתכלי כמה Y הוא מקריב. מי שמקריב הכי מעט נכנס ראשון.", "09/2024-3": "שלושה שלבים: (1) חשבי לכל חלקה את התפוקה השולית של כל פועל וכפלי ב־4,000 ש\"ח; (2) אכלסי 180 פועלים מהערך הגבוה לנמוך, זכרי שיש 50 חלקות מכל סוג; (3) השכר = ערך התפוקה של הפועל האחרון שנכנס.", "09/2024-4": "תפוקה כוללת = ממוצעת × מספר פועלים. חשבי אותה לכל היקף, ואז רווח = תפוקה (המחיר 1 ש\"ח) פחות 50 לכל פועל. ורגע לפני שאת בוחרת את \"הכי פחות גרוע\" — מה נותנת האפשרות לא לייצר כלל, כשאין הוצאות קבועות?", "09/2024-5": "מכס מצמצם יבוא בשני ערוצים: הצריכה יורדת (המחיר עלה) וגם הייצור גדל. סובסידיה עובדת בערוץ אחד בלבד. אם צריך להשיג את אותו צמצום דרך ערוץ אחד — מה זה גוזר על גודלה?", "09/2024-6": "תנאי המקסימום השני: בנקודת הייצור MC חייב לעלות. עברי על התשובות ושאלי על כל אחת — האם המצב המתואר אפשרי בנקודת ייצור של פירמה מרוויחה (או ממזערת הפסד)?", "09/2024-7": "המחיר המקומי = מחיר חו\"ל + הובלה. חשבי אותו לפני ואחרי ההתייקרות, הפכי את השינוי לאחוזים, והכפילי בגמישות (0.5) כדי לקבל את אחוז השינוי בכמות.", "09/2024-8": "במשק קטן המחיר העולמי קבוע — בדקי בכמה עולה המחיר לצרכן בכל אחד מהכלים. אם באותו סכום, מה זה אומר על הצריכה? ואז בדקי במה הכלים כן נבדלים: ייצור מקומי, יבוא, קופת המדינה. רמז: בשאלה הזו הרשות קיבלה יותר מתשובה אחת.", "09/2024-9": "הוצאה קבועה (120,000) = ביקוש בגמישות יחידתית: כמות = 120,000 ÷ מחיר. חשבי את הצריכה במחיר 12, את הייצור (צריכה + עודף), ואז את עלות שתי השיטות. אל תשכחי להשוות גם מה קורה לצרכנים ולבזבוז.", "09/2024-10": "פרקי לשלושה צעדים: מה עושה שיפור טכנולוגי למחיר X? מה עושה הוזלת X לביקוש למוצר תחליפי Y? ומתי ירידת מחיר מגדילה פדיון — באיזו גמישות?", "09/2024-11": "קודם חלצי את המסים: גירעון = הוצאה פחות מסים. ואז: הכנסה פנויה = תוצר − מסים − רווחים שלא חולקו (+ העברות, שאין כאן).", "09/2024-12": "הנתון הקריטי: הממשלה שומרת תמיד על תקציב מאוזן — כל שקל מס שנכנס יוצא כהוצאה. הוסיפי את זה לשיפוע הביקוש (צריכה + השקעה + מס שחוזר) וחשבי מכפיל. אחר כך עקבי אחרי ההכנסה הפנויה והחיסכון.", "09/2024-13": "מחיר אג\"ח והריבית נעים הפוך. אם את מצפה שהריבית תרד — מה יקרה למחיר האג\"ח, ומתי כדאי לקנות?", "09/2024-14": "שני שלבים: ΔY = מכפיל × ΔG. ואז היבוא גדל לפי הנטייה השולית לייבא כפול ΔY. היצוא לא תלוי בתוצר.", "09/2024-15": "כתבי את הזהות: חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + חשבון שוטף. הציבי את שני הנתונים (עודף יבוא = שוטף שלילי; חיסכון פרטי גדול מההשקעה) וראי מה נגזר על חיסכון הממשלה.", "09/2024-16": "שני ערוצים נפרדים: (1) מסים מעל ההוצאה — מה זה עושה לביקוש המצרפי? (2) פירעון חוב לבנק המרכזי — מה קורה לכסף ששולם אליו? עקבי אחרי כל ערוץ בנפרד.", "09/2024-17": "הזהות: חשבון שוטף + חשבון הון = שינוי ברזרבות. השוטף כולל את הסחורות והשירותים וגם את ההעברות. הציבי את שלושת הנתונים וחלצי את הנעלם.", "09/2024-18": "שיפוע הביקוש = 0.8 × (1 − 0.25). מכפיל = 1 ÷ (1 − שיפוע). תוצר = ביקוש אוטונומי × מכפיל. ואז השווי מסים (25% מהתוצר) מול ההוצאה 800, ובדקי את המרחק מ־6,000.", "09/2024-19": "הפקדת מזומן בבנק מתגלגלת: הפיקדונות גדלים פי (1 ÷ יחס הרזרבה). חשבי את השינוי הכולל באמצעי התשלום (פיקדונות שגדלו פחות מזומן שירד), ואז מצאי איזו פעולה מייצרת בדיוק את הכיוון ההפוך — ובאיזה סכום התחלתי.", "09/2024-20": "ההגדרה: תשלום העברה ניתן בלי תמורה בעד ייצור. עברי על ההיגדים ושאלי — איפה הוא כן נרשם, ולאן הוא נכנס אצל משק הבית שמקבל אותו?", "05/2023-1": "קראי שוב איך השאלה עצמה מגדירה \"רווח\" — זו לא ההגדרה הרגילה. ואם גם המחיר וגם MC (שנגזר מהשכר) יורדים באותו אחוז — מה קורה לנקודת החיתוך P=MC?", "05/2023-2": "יתרון יחסי = השוואת שיפועים (עלויות אלטרנטיביות), ובקו ישר השיפוע קבוע. בדקי לכל היגד: האם הנתונים שבו מספיקים לחישוב שני השיפועים?", "05/2023-3": "זו הכבדה של המועד — לאט ובסדר: (1) ערך תפוקה שולית לכל פועל בכל סוג חלקה (זכרי: גזר ב־2 ש\"ח); (2) שכר = הערך של הפועל ה־75 בדירוג; (3) רנטה לכל חלקה = פדיון פחות שכר; (4) שווי ההחלפה = הפרש הרנטות.", "05/2023-4": "מכסה ומכס שמצמצמים לאותה כמות מעלים את המחיר לאותה נקודה בדיוק. ההבדל היחיד — לאן הולך הפרש המחיר על היחידות המיובאות. עקבי אחרי הכסף.", "05/2023-5": "\"פרדוקס היבול\": כשההיצע גדל המחיר יורד. מה עושה גמישות קטנה מ־1 לפדיון כשהמחיר יורד? ומה קרה בינתיים להוצאות הייצור?", "05/2023-6": "ציירי לעצמך: להיצע הוותיקים (עולה) מתווסף היצע קשיח של עולים. השכר יורד — ועכשיו בדקי כל קבוצה לפי צורת ההיצע שלה: מי נשאר, מי פורש מרצון, ומי מועסק במלואו?", "05/2023-7": "שני כוחות פעלו: ירידת הכנסה (מזיזה ביקוש — לאיזה כיוון תלוי בסוג המוצר) והתייקרות תשומה (מכווצת היצע, מעלה מחיר, מקטינה כמות). הצריכה בסך הכול גדלה — איזה כוח יכול להסביר את זה, ומה זה מלמד על המוצר?", "05/2023-8": "תקבולים = מס ליחידה × כמות. המס ירד בדיוק פי 2 — אז התקבולים יעלו רק אם הכמות יותר מהוכפלה. בדקי בכמה לכל היותר יכול המחיר לצרכן לרדת, והאם זה מספיק. שימי לב שההיגד הנכון מנוסח כתנאי.", "05/2023-9": "התמקדי ביצרן המקומי בלבד: מה קובע את המחיר שהוא מקבל תחת מכס? ותחת סובסידיה באותו גובה? אם התוצאה זהה עבורו — מה נובע?", "05/2023-10": "מי קובע את המחיר בשוק המקומי כשקיים יצוא? המחיר נטו שהיצואן מקבל (עולמי פחות הובלה). ההובלה התייקרה — גזרי מכאן את הייצור, הצריכה המקומית והיצוא, אחד-אחד.", "05/2023-11": "הבחיני בין ממוצע לשולי: הנתון (צריכה מעל ההכנסה) מדבר על יחס ברמות — C חלקי Yd. וזכרי שני כללים: הממוצעות מסתכמות תמיד ל־1, וגם השוליות.", "05/2023-12": "סדר פעולות: השקעה מקומית = השקעה לאומית + עודף יבוא; ואז G מהזהות של התוצר; מסים = G + העברות − גירעון; ולבסוף הכנסה פנויה = תוצר − מסים + העברות.", "05/2023-13": "משיכת מזומן מהבנק מכווצת פיקדונות פי (1 ÷ יחס הרזרבה). חשבי את הירידה הכוללת באמצעי התשלום, ואז חפשי פעולה שמזרימה בדיוק את הסכום ההופכי — שימי לב ממי קונים ובאיזה סכום.", "05/2023-14": "לריבית במשק פתוח שני ערוצים: ריסון הביקוש המקומי, והשפעה דרך תנועות הון על שער החליפין. כשהריבית עולה — לאן זורם ההון, מה קורה לשקל, ומה זה עושה למחירי היבוא?", "05/2023-15": "אם הצריכה הפרטית לבדה גדולה מהתוצר — מה סימן החיסכון הלאומי (תוצר פחות כל הצריכות)? והבחיני: השקעה לאומית (= החיסכון) מול השקעה מקומית (שיכולה להיות ממומנת מעודף יבוא).", "05/2023-16": "הפער נמדד בנקודת התעסוקה המלאה, לא בשיווי המשקל: עודף הביקוש שם = הפרש התוצר × (1 − השיפוע). אל תבלבלי בין הפער (400) להפרש התוצר (1,000).", "05/2023-17": "בתעסוקה מלאה אין מקורות פנויים. בדקי כל הצעה: מה היא עושה לביקוש הכולל? חיסכון לבדו — אבטלה; השקעה לבדה — אינפלציה. מה נשאר?", "05/2023-18": "המלכודת: מתנה נרשמת פעמיים — יבוא סחורה וגם העברה חד־צדדית. בני שלושה חשבונות בנפרד: סחורות ושירותים (כולל ריבית), שוטף (בתוספת העברות), הון (הלוואות נטו) — ואז שינוי הרזרבות.", "05/2023-19": "מתי העברת שקל מעשיר לעני מגדילה את סך הצריכה? רק אם השקל \"מייצר\" אצל העני יותר צריכה מאשר אצל העשיר. אילו שתי הנחות נדרשות לכך בו־זמנית?", "05/2023-20": "כתבי את הזהות: חיסכון פרטי + חיסכון ממשלה = השקעה מקומית + (יצוא − יבוא). הציבי כל היגד בנפרד — רק אחד נובע בהכרח מהסימנים הנתונים.", "02/2024-1": "משק קטן = המחיר נקבע בעולם ולא זז. אם ההיצע המקומי גדל באותו מחיר — על חשבון מה זה בא (יבוא)? ולסעיף האחרון: עד לאן ממשיכים להעסיק פועלים, ומה זה עושה לתפוקה השולית בשיווי המשקל?", "02/2024-2": "בני עמודת תפוקה שולית (ההפרש בין שורות) וכפלי ב־20 ש\"ח. העסיקי כל פועל שערכו עולה על השכר 1,800 — ועצרי ברגע שזה מתהפך.", "02/2024-3": "עלות הממשלה = סובסידיה ליחידה × כל הייצור. כדי להזיז 20,000 טון עם פער מחירים קטן — האם צריך ביקוש והיצע גמישים או קשיחים?", "02/2024-4": "חשבי עלות אלטרנטיבית לכל סוג פועל בשני המוצרים (א': 2 חיטה לפרי; ב': 4). מי מייצר כל מוצר ראשון? ואז לכל היגד בדקי בתוך איזו קיבולת הכמות נופלת — ומי הפועל השולי שם.", "02/2024-5": "היצואן מקבל את המחיר העולמי פחות ההובלה, וזה המחיר שמתייצב גם בשוק המקומי. ההובלה התייקרה — עקבי אחרי המחיר נטו וגזרי ממנו את כל ארבעת הכיוונים: מחיר, ייצור, יצוא, שיווק מקומי.", "02/2024-6": "ההיצע זז ימינה בוודאות (תשומה הוזלה) — לבדו זה מגדיל כמות ומוריד מחיר. שאלי על כל היגד: איזו תוצאה נצפית רק ביקוש שזז יכול להסביר, ולאיזה כיוון?", "02/2024-7": "מהממוצע חלצי את הנקודה הנוכחית: 2 טון × 100 תותחים = כמה תפוזים כבר הוקרבו מתוך 1,000? ובעקומה קמורה — 50 התותחים הבאים יעלו יותר או פחות מהממוצע עד עכשיו?", "02/2024-8": "שני תנאים יחד: MC חייב לעלות (תנאי שני), והמחיר חייב לכסות את ההוצאה המשתנה הממוצעת (אחרת סוגרים). היכן נמצא MC ביחס ל־AVC כשה־AVC עולה? וכשהוא יורד?", "02/2024-9": "יבוא = ביקוש מקומי − היצע מקומי. חלצי מהנתונים את השינוי בייצור. ואז זכרי: גמישות משווה אחוזים, לא כמויות — ובסיס הביקוש (עם יבוא) תמיד גדול מבסיס ההיצע.", "02/2024-10": "בדקי לכל כלי שני מחירים: מה קורה למחיר שהיצרן מקבל, ומה למחיר שהצרכן משלם. חפשי את הכלי היחיד שמיטיב עם צד אחד בלי לפגוע בשני.", "02/2024-11": "התוצר מצד ההכנסות = שכר + ריבית + דיבידנד + רווחים שלא חולקו + מס חברות. תקציב: כל המסים פחות העברות פחות צריכה ציבורית. ואז השקעה מקומית = חיסכון לאומי + עודף יבוא.", "02/2024-12": "שוב הזהות: חיסכון פרטי + ממשלתי = השקעה מקומית + (יצוא − יבוא). ההיגדים מותנים בסימן של מאזן הסחר — בדקי כל תנאי בנפרד.", "02/2024-13": "נדרש כלי שעושה שניים בבת אחת: מעלה תוצר וגם משפר את חשבון הסחר. עברי על הארבעה: מה כל אחד עושה ליבוא וליצוא?", "02/2024-14": "פער דפלציוני 500 בנקודת התעסוקה המלאה, מכפיל = 1 ÷ (1 − 0.75) = 4. כמה נמוך יהיה שיווי המשקל מהיעד?", "02/2024-15": "היעד: שהצריכה הפרטית תרד ב־500 בדיוק. מס מקטין צריכה רק לפי הנטייה השולית לצרוך — אז מס של 500 בדיוק מספיק? ומה עם מימון בהדפסה או במילווה?", "02/2024-16": "שלושה חשבונות בנפרד: סחורות (יצוא פחות יבוא); שוטף (בתוספת ההעברות — שימי לב לכיוון: המשק שילם); הון (הלוואות שהתקבלו פחות השקעות בחו\"ל). הסכום = שינוי הרזרבות.", "02/2024-17": "חיסכון לאומי = השקעה מקומית + (יצוא − יבוא). ואז פרקי: לאומי = אישי + עסקי + ממשלתי. מה תורם כל רכיב, ובאיזה סימן נכנס הגירעון?", "02/2024-18": "רכישת אג\"ח מהבנקים מזרימה רזרבות. הפיקדונות מתרחבים פי (1 ÷ 0.25). והמזומן? קבוע לפי הנתון — אז מה בדיוק גדל?", "02/2024-19": "מס קבוע פוגע פעמיים: ישר בהכנסה הפנויה, ובעקיפין דרך התכווצות התוצר. בני את השיפוע: צריכה 0.5×0.8 + השקעה 0.3 − יבוא 0.1. מכפיל, ואז ΔYd כולל (גם מהתוצר וגם מהמס עצמו) — וממנו ΔC.", "02/2024-20": "הקריטריון: תמורה בעד ייצור שוטף. סנני החוצה שלושה סוגים: העברות ללא תמורה, נכסים שיוצרו בעבר, ועסקאות פיננסיות טהורות."};
/* ---------- exam player ---------- */
const EXAMS=[...new Set(EXAMQ.map(q=>q.ex))];
function exQs(){return EXAMQ;}
function isRight(q,pick){return q.a.includes(pick);}

const FB_OK=["בדיוק!","נכון מאוד","יפה, מדויק","עוד אחת בכיס","שולטת בזה","מצוין","חד וחלק","ככה בדיוק בבחינה"];
const FB_NO=["לא הפעם","כמעט","מלכודת מוכרת","שווה עוד מבט","קורה לרוב הנבחנים","לא מדויק"];
const TL_OK=["נכון, יפה מאוד","מדויק — ככה זה נראה","עוד נושא שמתייצב","תשובה נכונה, בביטחון","הכיוון הנכון לגמרי"];
const TL_NO=["לא מדויק הפעם","זו מלכודת מוכרת — עכשיו היא שלך","כמעט, וזה החלק שלומדים ממנו","טעות ששווה זהב עכשיו","לא נורא — בשביל זה מתרגלים"];
function fbPick(arr,key){let h=0;for(const c of key)h=(h*31+c.charCodeAt(0))>>>0;return arr[h%arr.length];}
function renderPlayer(){
  const qs=exQs(),qi=Math.min(S.qi.all||0,qs.length-1),q=qs[qi];
  const key=q.ex+"-"+q.n,pick=S.picked[key],revealed=!pick&&S.revealed&&S.revealed[key];
  const answered=qs.filter(x=>S.picked[x.ex+"-"+x.n]);
  const right=answered.filter(x=>isRight(x,S.picked[x.ex+"-"+x.n])).length;
  document.getElementById("pPos").textContent="שאלה "+(qi+1)+" מתוך "+qs.length+" · מועד "+q.ex;
  const sc=document.getElementById("pScore");
  const grade=answered.length?Math.round(right/answered.length*100):0;
  const newTxt=answered.length?right+"/"+answered.length+" · ציון "+grade:"";
  if(sc.textContent!==newTxt&&newTxt){sc.classList.remove("score-pop");void sc.offsetWidth;sc.classList.add("score-pop");}
  sc.textContent=newTxt;
  sc.classList.toggle("fail",answered.length>0&&grade<60);
  document.getElementById("pBar").style.width=(answered.length/qs.length*100)+"%";
  document.getElementById("qArea").innerHTML=
    `<div class="qtext">${q.q}</div>`
    +Object.entries(q.o).map(([L,t])=>{
      let cls="optbtn",verdict="";
      if(revealed){if(q.a.includes(L))cls+=" right";cls+=" done";}
      if(pick){
        if(q.a.includes(L))cls+=" right";else if(L===pick)cls+=" wrong";cls+=" done";
        if(L===pick)verdict=isRight(q,pick)
          ?'<span class="verdict vg">✓ '+fbPick(FB_OK,key+pick)+'</span>'
          :'<span class="verdict vr">✕ '+fbPick(FB_NO,key+pick)+' — הנכונה: '+q.a+'</span>';
      }
      return `<button class="${cls}" data-l="${L}" style="animation-delay:${60+["א","ב","ג","ד","ה"].indexOf(L)*55}ms"><b>${L}.</b> ${t}${verdict}</button>`;
    }).join("")
    +(!pick&&!revealed?`<div class="deepen">
        <span class="sollbl" style="margin:0">${G("צריכה עזרה?","צריך עזרה?")}</span>
        <button class="qbtn" id="hintBtn">הדרכה — בלי לחשוף</button>
        <button class="qbtn ghost" id="revealBtn">פתרון מלא — חושף</button>
      </div>`:"")
    +((pick||revealed)?`<div class="deepen"><button class="qbtn" id="solOpen">הסבר מלא</button></div>`:"");
  document.getElementById("dots").innerHTML=qs.map((x,ii)=>{
    const pk=S.picked[x.ex+"-"+x.n];
    let c=pk?(isRight(x,pk)?" g":" r"):(S.revealed&&S.revealed[x.ex+"-"+x.n]?" b":"");
    return `<button class="dot2${c}${ii===qi?" cur":""}" data-i="${ii}"></button>`;
  }).join("");
  document.getElementById("prevQ").disabled=qi===0;
  document.getElementById("nextQ").disabled=qi===qs.length-1;
}
document.getElementById("qArea").addEventListener("click",async e=>{
  if(e.target.closest("#solOpen")){
    if(renderSol())openSheet("sol");return;
  }
  if(e.target.closest("#hintBtn")){
    renderGuide();openSheet("guide");return;
  }
  if(e.target.closest("#revealBtn")){
    const qs=exQs(),q=qs[Math.min(S.qi.all||0,qs.length-1)];
    S.revealed=S.revealed||{};S.revealed[q.ex+"-"+q.n]=1;save();
    renderPlayer();
    if(renderSol())openSheet("sol");
    return;
  }
  const b=e.target.closest(".optbtn");if(!b||b.classList.contains("done"))return;
  const qs=exQs(),q=qs[Math.min(S.qi.all||0,qs.length-1)];
  if(S.revealed&&S.revealed[q.ex+"-"+q.n])return;
  S.picked[q.ex+"-"+q.n]=b.dataset.l;save();
  renderPlayer();
  if(renderSol())openSheet("sol");
});
document.getElementById("dots").addEventListener("click",e=>{
  const d=e.target.closest(".dot2");if(!d)return;
  S.qi.all=+d.dataset.i;save();renderPlayer();
});
document.getElementById("prevQ").addEventListener("click",()=>{
  S.qi.all=Math.max(0,(S.qi.all||0)-1);save();renderPlayer();
});
document.getElementById("restartEx").addEventListener("click",()=>{
  if(!confirm("להתחיל את כל התרגול מחדש? כל התשובות יימחקו."))return;
  S.picked={};S.revealed={};
  S.qi.all=0;save();renderPlayer();
});
document.getElementById("nextQ").addEventListener("click",()=>{
  S.qi.all=Math.min(exQs().length-1,(S.qi.all||0)+1);save();renderPlayer();
});
renderPlayer();


/* ---------- solution overlay ---------- */
function renderSol(){
  const qs=exQs(),q=qs[Math.min(S.qi.all||0,qs.length-1)];
  const key=q.ex+"-"+q.n,pick=S.picked[key],revealed=!pick&&S.revealed&&S.revealed[key];
  if(!pick&&!revealed)return false;
  const ok=pick?isRight(q,pick):null,last=(S.qi.all||0)===qs.length-1;
  document.getElementById("solTitle").textContent="שאלה "+q.n+" · מועד "+q.ex;
  document.getElementById("solWrap").innerHTML=`<div class="gsec gq"><span class="sollbl">השאלה</span><p>${q.q}</p>
      ${Object.entries(q.o).map(([L,t])=>{
        let m="";
        if(q.a.includes(L))m=" solright";else if(L===pick)m=" solwrong";
        return `<p class="solopt${m}"><b>${L}.</b> ${t}</p>`;}).join("")}
    </div>
    <div class="solbox insol ${pick?(ok?"okk":"nok"):"rvl"}">
        <div class="solhead">
          <span class="solmark">${pick?(ok?"✓":"✕"):"☰"}</span>
          <div class="soltit">
            <b>${pick?nameTouch(fx(ok?fbPick(TL_OK,key):fbPick(TL_NO,key)),key):"הפתרון נחשף לבקשתך"}</b>
            <span>${pick?(ok?"סימנת "+pick:"סימנת "+pick+" · הנכונה: "+q.a):"השאלה לא תיספר בציון"}</span>
          </div>
          <span class="solchip">${q.a}</span>
        </div>
        ${pick&&!ok&&WHY[key]&&WHY[key][pick]?`<div class="solsec whyme"><span class="sollbl">למה התשובה שסימנת שגויה</span>
          <p>${fx(WHY[key][pick])}</p>
        </div>`:""}
        <div class="solsec"><span class="sollbl">ההסבר</span>
          <p>${fx(SOL[key]||"")}</p>
        </div>
        ${WHY[key]?`<div class="solsec">
          <button class="whyall-btn">למה שאר התשובות שגויות ▾</button>
          <div class="whyall hidden">${Object.entries(WHY[key]).filter(([L])=>L!==pick).map(([L,t])=>
            `<p><b>${L}.</b> ${fx(t)}</p>`).join("")}</div>
        </div>`:""}
        <div class="solfoot">
          <span class="solnote">ההסבר נכתב מראש ונבדק מול המפתח הרשמי של הרשות.</span>
          ${last?"":'<button class="nextsol" id="nextFromSol">לשאלה הבאה ←</button>'}
        </div>
      </div>`;
  return true;
}
document.getElementById("solWrap").addEventListener("click",e=>{
  const wb=e.target.closest(".whyall-btn");
  if(wb){
    const list=wb.nextElementSibling;list.classList.toggle("hidden");
    wb.textContent=list.classList.contains("hidden")?"למה שאר התשובות שגויות ▾":"למה שאר התשובות שגויות ▴";
    return;
  }
  if(e.target.closest("#nextFromSol")){
    S.qi.all=Math.min(exQs().length-1,(S.qi.all||0)+1);save();
    closeSheet();renderPlayer();
  }
});

/* ---------- guide overlay ---------- */
function renderGuide(){
  const qs=exQs(),q=qs[Math.min(S.qi.all||0,qs.length-1)];
  const key=q.ex+"-"+q.n,T=GTYPES[GTYPE[key]]||{};
  document.getElementById("gTitle").textContent="הדרכה · שאלה "+q.n+" · מועד "+q.ex;
  document.getElementById("guideBody").innerHTML=
    '<div class="gsec gq"><span class="sollbl">השאלה</span><p>'+q.q+'</p></div>'
   +'<div class="gsec"><span class="sollbl">מה בעצם שואלים</span><p>'+fx(GWHAT[key]||"")+'</p></div>'
   +'<div class="gsec"><span class="sollbl">על שאלות מהסוג הזה</span><p>'+fx(T.t||"")+'</p></div>'
   +'<div class="gsec"><span class="sollbl">מה כדאי לזכור</span><p>'+fx(T.r||"")+'</p></div>'
   +'<div class="gsec"><span class="sollbl">זיהוי מהיר ופתרון קל</span><p>'+fx(T.z||"")+'</p></div>'
   +'<div class="gsec gme"><span class="sollbl">איך לגשת דווקא לשאלה הזו</span><p>'+fx(HINT[key]||"")+'</p></div>';
}

/* ---------- preferences ---------- */
function leaMode(){
  const n=(S.name||"").trim();
  const on=n==="לאה"||n==="לאה'לה"||n==="Leah"||n==="leah";
  document.body.classList.toggle("lea",on);
  const av=document.getElementById("leaAva");
  if(av)av.classList.toggle("hidden",!on);
}
function applyPrefs(){
  leaMode();
  const qs=exQs(),cur=qs[Math.min(S.qi.all||0,qs.length-1)];
  const sel=document.getElementById("examSel");
  sel.innerHTML=[...new Set(qs.map(x=>x.ex))].map(ex=>
    `<option value="${ex}"${ex===cur.ex?" selected":""}>מבחן כלכלה · מועד ${ex}</option>`).join("");
  document.querySelectorAll(".gsel").forEach(b=>b.classList.toggle("on",b.dataset.g===S.gender));
  document.getElementById("prefName").value=S.name||"";
  renderPlayer();
}
document.getElementById("prefSave").addEventListener("click",()=>{
  S.name=document.getElementById("prefName").value;
  save();leaMode();renderPlayer();closeSheet();
});
document.getElementById("examSel").addEventListener("change",function(){
  const qs=exQs(),i=qs.findIndex(x=>x.ex===this.value);
  if(i>=0){S.qi.all=i;save();renderPlayer();closeSheet();}
});
document.querySelectorAll(".gsel").forEach(b=>b.addEventListener("click",()=>{
  S.gender=b.dataset.g;save();applyPrefs();
}));
document.getElementById("nameClear").addEventListener("click",()=>{
  S.name="";save();leaMode();
  document.getElementById("prefName").value="";
  renderPlayer();
});
let pnT;
document.getElementById("prefName").addEventListener("input",function(){
  S.name=this.value;clearTimeout(pnT);pnT=setTimeout(()=>{save();leaMode();renderPlayer();},400);
});



/* ---------- init ---------- */
applyPrefs();

</script>
</body>
</html>
